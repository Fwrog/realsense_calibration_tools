[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realsense-calibration-tools"
version = "0.2.0"
description = "Marker-guided RealSense calibration, automatic capture and RGB-D diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "RealSense Calibration Tools contributors" }
]
dependencies = [
  "numpy",
  "PyYAML",
  "Pillow",
  "matplotlib",
  "opencv-contrib-python>=4.8,<5",
  "pyrealsense2",
  "reportlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rs-calib = "rs_calib_tools.automatic:main"
